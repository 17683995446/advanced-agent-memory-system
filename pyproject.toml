[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "agent-memory-system"
version = "3.0.0"
description = "高度模块化的 Agent 长短期记忆系统，基于开源生态构建"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "AI Assistant"},
]
keywords = ["agent", "memory", "llm", "vector-store", "knowledge-graph", "embedding", "orm", "redis", "event-driven"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Artificial Intelligence",
]

dependencies = [
    "numpy>=1.21.0",
    "pydantic>=2.0.0",
    "jieba>=0.42.1",
    "cachetools>=5.0.0",
    "tenacity>=8.0.0",
    "blinker>=1.7.0",  # 事件总线
]

[project.optional-dependencies]
embedding-st = ["sentence-transformers>=2.0.0"]
embedding-openai = ["openai>=1.0.0"]
vectorstore-chroma = ["chromadb>=0.4.0"]
vectorstore-faiss = ["faiss-cpu>=1.7.0"]
vectorstore-redis = ["redis>=5.0.0"]  # Redis 向量存储
orm = ["sqlmodel>=0.0.14"]  # SQLModel ORM
metrics = ["prometheus-client>=0.17.0"]
all = [
    "sentence-transformers>=2.0.0",
    "openai>=1.0.0",
    "chromadb>=0.4.0",
    "faiss-cpu>=1.7.0",
    "redis>=5.0.0",
    "sqlmodel>=0.0.14",
    "prometheus-client>=0.17.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.urls]
Homepage = "https://github.com/example/agent-memory-system"

[tool.setuptools.packages.find]
include = ["memory_system*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["memory_system"]

[tool.coverage.report]
show_missing = true
skip_covered = true
